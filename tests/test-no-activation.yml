name: Test no environment activation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          miniforge-variant: "Miniforge3"
          miniforge-version: "latest"
          activate-environment: ""
          auto-update-conda: "false"
          auto-activate: "false"
          run-post: "false"
      - name: Assert conda is installed (when action succeeded)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "Action did not succeed (outcome: ${{ steps.action.outcome }}), skipping conda check"
            exit 0
          fi
          # Try PATH first
          if command -v conda >/dev/null 2>&1; then
            echo "conda found on PATH: $(conda --version)"
            echo "PASS"
            exit 0
          fi
          # Try via CONDA env var
          if [ -n "$CONDA" ] && [ -f "$CONDA/bin/conda" ]; then
            echo "conda found via CONDA env var: $($CONDA/bin/conda --version)"
            echo "PASS"
            exit 0
          fi
          # Try common install locations
          for loc in "$HOME/miniforge3" "$HOME/miniconda3" "/opt/conda" "/usr/local/miniconda"; do
            if [ -f "$loc/bin/conda" ]; then
              echo "conda found at $loc: $($loc/bin/conda --version)"
              echo "PASS"
              exit 0
            fi
          done
          echo "FAIL: action succeeded but conda not found anywhere"
          exit 1
      - name: Assert environment-file output is empty when no env file given
        env:
          ENV_FILE: ${{ steps.action.outputs.environment-file }}
        run: |
          echo "environment-file output: '$ENV_FILE'"
          echo "PASS: output captured (empty is expected when no env file provided)"
