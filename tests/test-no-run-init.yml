name: Test no conda init (run-init false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          miniforge-variant: "Miniforge3"
          miniforge-version: "latest"
          activate-environment: "test"
          auto-update-conda: "false"
          auto-activate: "true"
          run-init: "false"
          remove-profiles: "false"
      - name: Assert conda binary exists without shell init
        run: |
          echo "Checking conda binary exists..."
          echo "CONDA env var: $CONDA"
          # When run-init=false, conda is installed but shell profiles are not modified
          CONDA_BIN=""
          if [ -n "$CONDA" ] && [ -f "$CONDA/bin/conda" ]; then
            CONDA_BIN="$CONDA/bin/conda"
          else
            for dir in "$HOME/miniforge3/bin" "$HOME/miniconda3/bin" "/opt/miniconda3/bin" "/opt/miniforge3/bin"; do
              if [ -f "$dir/conda" ]; then
                CONDA_BIN="$dir/conda"
                break
              fi
            done
          fi
          if [ -z "$CONDA_BIN" ] && command -v conda &>/dev/null; then
            CONDA_BIN=$(command -v conda)
          fi
          echo "conda binary found: $CONDA_BIN"
          if [ -z "$CONDA_BIN" ]; then
            echo "FAIL: conda binary not found even with run-init=false"
            exit 1
          fi
          CONDA_VERSION=$("$CONDA_BIN" --version 2>&1 || true)
          echo "conda version: $CONDA_VERSION"
          if [ -z "$CONDA_VERSION" ]; then
            echo "FAIL: conda not functional"
            exit 1
          fi
          echo "PASS: conda binary is present and functional"
      - name: Assert environment-file output
        env:
          ENV_FILE: ${{ steps.setup.outputs.environment-file }}
        run: |
          echo "environment-file output: '$ENV_FILE'"
          echo "PASS: outputs checked for run-init=false scenario"
