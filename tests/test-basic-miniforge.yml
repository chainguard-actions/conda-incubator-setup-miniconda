name: Test basic Miniforge setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          miniforge-version: latest
          activate-environment: test
          auto-update-conda: "false"
          auto-activate-base: "false"
      - name: Assert conda is available
        run: |
          echo "Checking conda is on PATH..."
          if ! command -v conda &>/dev/null; then
            echo "FAIL: conda not found on PATH"
            exit 1
          fi
          CONDA_VER=$(conda --version 2>&1)
          echo "conda version: $CONDA_VER"
          echo "PASS: conda is available"
      - name: Assert environment-file output
        env:
          ENV_FILE: ${{ steps.setup.outputs.environment-file }}
        run: |
          echo "environment-file output: '$ENV_FILE'"
          # When no environment-file is provided, this may be empty — that is acceptable
          echo "PASS: environment-file output checked"
      - name: Assert conda info
        shell: bash -el {0}
        run: |
          conda info
          echo "PASS: conda info succeeded"
