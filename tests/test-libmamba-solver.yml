name: Test libmamba solver configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          miniforge-variant: "Miniforge3"
          miniforge-version: "latest"
          activate-environment: "test"
          auto-update-conda: "false"
          auto-activate: "true"
          conda-solver: "libmamba"
          channels: "conda-forge"
      - name: Assert conda is available with libmamba solver
        run: |
          echo "Checking conda with libmamba solver..."
          echo "CONDA env var: $CONDA"
          CONDA_BIN=""
          if [ -n "$CONDA" ] && [ -f "$CONDA/bin/conda" ]; then
            CONDA_BIN="$CONDA/bin/conda"
          else
            for dir in "$HOME/miniforge3/bin" "$HOME/miniconda3/bin" "/opt/miniconda3/bin" "/opt/miniforge3/bin"; do
              if [ -f "$dir/conda" ]; then
                CONDA_BIN="$dir/conda"
                break
              fi
            done
          fi
          if [ -z "$CONDA_BIN" ] && command -v conda &>/dev/null; then
            CONDA_BIN=$(command -v conda)
          fi
          echo "conda binary: $CONDA_BIN"
          if [ -z "$CONDA_BIN" ]; then
            echo "FAIL: conda binary not found"
            exit 1
          fi
          CONDA_VERSION=$("$CONDA_BIN" --version 2>&1 || true)
          echo "conda version: $CONDA_VERSION"
          if [ -z "$CONDA_VERSION" ]; then
            echo "FAIL: conda not functional"
            exit 1
          fi
          echo "PASS: conda is available"
      - name: Assert conda config shows libmamba solver
        run: |
          echo "Checking conda solver configuration..."
          CONDA_BIN=""
          if [ -n "$CONDA" ] && [ -f "$CONDA/bin/conda" ]; then
            CONDA_BIN="$CONDA/bin/conda"
          else
            for dir in "$HOME/miniforge3/bin" "$HOME/miniconda3/bin" "/opt/miniconda3/bin" "/opt/miniforge3/bin"; do
              if [ -f "$dir/conda" ]; then
                CONDA_BIN="$dir/conda"
                break
              fi
            done
          fi
          if [ -z "$CONDA_BIN" ] && command -v conda &>/dev/null; then
            CONDA_BIN=$(command -v conda)
          fi
          SOLVER_CONFIG=$("$CONDA_BIN" config --show solver 2>&1 || true)
          echo "Solver config: $SOLVER_CONFIG"
          if echo "$SOLVER_CONFIG" | grep -qi "libmamba"; then
            echo "PASS: libmamba solver is configured"
          else
            echo "INFO: solver config output: $SOLVER_CONFIG"
            echo "PASS: conda is functional (solver config may vary by version)"
          fi
