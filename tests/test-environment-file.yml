name: Test environment file setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create environment file
        run: |
          cat > "$GITHUB_WORKSPACE/environment-test.yml" << 'EOF'
          name: myenv
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.11
          EOF
      - id: setup
        uses: .
        with:
          miniforge-variant: "Miniforge3"
          miniforge-version: "latest"
          environment-file: "environment-test.yml"
          activate-environment: "myenv"
          auto-update-conda: "false"
          auto-activate-base: "false"
      - name: Assert environment-file output is set
        env:
          ENV_FILE: ${{ steps.setup.outputs.environment-file }}
          ENV_CONTENT: ${{ steps.setup.outputs.environment-file-content }}
        run: |
          echo "environment-file: '$ENV_FILE'"
          echo "environment-file-content length: ${#ENV_CONTENT}"
          if [ -z "$ENV_FILE" ]; then
            echo "FAIL: environment-file output is empty"
            exit 1
          fi
          echo "PASS: environment-file output is set to '$ENV_FILE'"
      - name: Assert environment-file-content output is set
        env:
          ENV_CONTENT: ${{ steps.setup.outputs.environment-file-content }}
        run: |
          echo "environment-file-content: '$ENV_CONTENT'"
          if [ -z "$ENV_CONTENT" ]; then
            echo "FAIL: environment-file-content output is empty"
            exit 1
          fi
          echo "PASS: environment-file-content is set"
      - name: Assert environment-file-was-patched output is set
        env:
          WAS_PATCHED: ${{ steps.setup.outputs.environment-file-was-patched }}
        run: |
          echo "environment-file-was-patched: '$WAS_PATCHED'"
          # This should be either 'true' or 'false', not empty
          if [ -z "$WAS_PATCHED" ]; then
            echo "FAIL: environment-file-was-patched output is empty"
            exit 1
          fi
          echo "PASS: environment-file-was-patched is '$WAS_PATCHED'"
