name: Test environment file usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create environment file
        run: |
          cat > "$GITHUB_WORKSPACE/test-environment.yml" << 'EOF'
          name: testenv
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.11
          EOF
          echo "Environment file created:"
          cat "$GITHUB_WORKSPACE/test-environment.yml"
      - id: setup
        uses: .
        with:
          miniforge-variant: "Miniforge3"
          miniforge-version: "latest"
          environment-file: "test-environment.yml"
          activate-environment: "testenv"
          auto-update-conda: "false"
          auto-activate: "true"
      - name: Assert environment-file output is set
        env:
          ENV_FILE: ${{ steps.setup.outputs.environment-file }}
        run: |
          echo "environment-file output: '$ENV_FILE'"
          if [ -z "$ENV_FILE" ]; then
            echo "FAIL: environment-file output is empty"
            exit 1
          fi
          echo "PASS: environment-file output is set to: $ENV_FILE"
      - name: Assert environment-file-content output is set
        env:
          ENV_CONTENT: ${{ steps.setup.outputs.environment-file-content }}
        run: |
          echo "environment-file-content output: '$ENV_CONTENT'"
          if [ -z "$ENV_CONTENT" ]; then
            echo "FAIL: environment-file-content output is empty"
            exit 1
          fi
          echo "PASS: environment-file-content output is set"
      - name: Assert conda environment exists
        run: |
          echo "Checking conda environments..."
          echo "CONDA env var: $CONDA"
          CONDA_BIN=""
          if [ -n "$CONDA" ] && [ -f "$CONDA/bin/conda" ]; then
            CONDA_BIN="$CONDA/bin/conda"
          else
            for dir in "$HOME/miniforge3/bin" "$HOME/miniconda3/bin" "/opt/miniconda3/bin" "/opt/miniforge3/bin"; do
              if [ -f "$dir/conda" ]; then
                CONDA_BIN="$dir/conda"
                break
              fi
            done
          fi
          if [ -z "$CONDA_BIN" ] && command -v conda &>/dev/null; then
            CONDA_BIN=$(command -v conda)
          fi
          echo "conda binary: $CONDA_BIN"
          "$CONDA_BIN" env list
          if "$CONDA_BIN" env list | grep -q "testenv"; then
            echo "PASS: testenv environment found"
          else
            echo "FAIL: testenv environment not found"
            exit 1
          fi
